# Every morning at 8:00 a.m. California time:
#   1. read the Legislature's change files and news feeds  (dv_index/update.py, dv_index/news.py)
#   2. commit any changed data in web/data/ back to this branch
#   3. build the Next.js site (web/) and deploy it to GitHub Pages
#
# Also runs:
#   - by hand: Actions tab > "Daily update and deploy" > Run workflow (tick "full" to rebuild everything)
#   - on any push that changes the site, the pipeline or the codebook (deploy only, no data fetch)
#   - full rebuild from the whole session file every Sunday
#
# Scheduled runs only fire on the repository's DEFAULT branch.

name: Daily update and deploy

on:
  schedule:
    # GitHub cron is UTC and scheduled runs often start late, sometimes by hours.
    # So there are several tries each morning; the first one that starts at or
    # after 8:00 a.m. California time does the update, and the rest see that
    # today's update is already done and stop. (15:07 UTC is 7:07 a.m. PST /
    # 8:07 a.m. PDT; the last try is 11:07 a.m. PST.)
    - cron: "7 15 * * *"
    - cron: "7 16 * * *"
    - cron: "7 17 * * *"
    - cron: "7 18 * * *"
    - cron: "7 19 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild from the whole session file (about 1.2 GB) instead of this week's change files"
        type: boolean
        default: false
      reset_news:
        description: "Drop saved headlines and collect them again"
        type: boolean
        default: false
  push:
    paths:
      - "web/**"
      - "dv_index/**"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write   # commit the updated data
  pages: write      # deploy to GitHub Pages
  id-token: write   # required by deploy-pages

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      skipped: ${{ steps.when.outputs.skip }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide whether to update now
        id: when
        run: |
          now_hour=$(TZ=America/Los_Angeles date +%H)
          today=$(TZ=America/Los_Angeles date +%F)
          last=$(python3 -c "import json; print(json.load(open('web/data/meta.json')).get('updated', ''))" 2>/dev/null || true)
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$((10#$now_hour))" -lt 8 ]; then skip=true; echo "Before 8 a.m. in California."; fi
            if [ "$last" = "$today" ]; then skip=true; echo "Already updated today ($today)."; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "California time: $(TZ=America/Los_Angeles date); last update: ${last:-never}; skip=$skip"

      - uses: actions/setup-python@v7
        if: steps.when.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        if: steps.when.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Update bills from the Legislature
        if: steps.when.outputs.skip != 'true'
        working-directory: dv_index
        run: |
          today=$(TZ=America/Los_Angeles date +%F)
          if [ "${{ inputs.full }}" = "true" ] || [ "$(TZ=America/Los_Angeles date +%u)" = "7" ]; then
            python update.py --full --today "$today"
          else
            python update.py --today "$today"
          fi

      - name: Update news headlines
        if: steps.when.outputs.skip != 'true'
        working-directory: dv_index
        run: python news.py ${{ inputs.reset_news && '--reset' || '' }}

      - name: Commit changed data
        if: steps.when.outputs.skip != 'true'
        run: |
          git config user.name "dv-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --cached --quiet; then
            echo "No data changes today."
          else
            git commit -m "Daily data update $(TZ=America/Los_Angeles date +%F)"
            git push
          fi

  deploy:
    needs: update
    # Deploy after a successful update, and on pushes (where update is skipped),
    # but only from the default branch: feature branches build nothing.
    if: >-
      always() && needs.update.outputs.skipped != 'true'
      && (needs.update.result == 'success' || needs.update.result == 'skipped')
      && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}   # pick up the commit the update job just pushed

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build the site
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
