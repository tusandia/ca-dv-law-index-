# Cross-check the flagging tool against LegiScan's full-text search
# (dv_index/legiscan_check.py) and commit the report to dv_index/results/.
#
# Needs the repository secret LEGISCAN_API_KEY
# (Settings > Secrets and variables > Actions > New repository secret).
#
# Runs by hand (Actions tab > "LegiScan cross-check" > Run workflow) and every
# Monday, so new bills in a session get checked without anyone remembering to.

name: LegiScan cross-check

on:
  workflow_dispatch:
    inputs:
      year:
        description: "LegiScan session filter: 1 all, 2 current, 3 recent, 4 prior"
        default: "2"
  schedule:
    - cron: "23 17 * * 1"   # Mondays, 9:23 a.m. PST / 10:23 a.m. PDT

permissions:
  contents: write

concurrency:
  group: daily-update   # don't race the daily data commit
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run the cross-check
        working-directory: dv_index
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: |
          if [ -z "$LEGISCAN_API_KEY" ]; then
            echo "::error::Add the repository secret LEGISCAN_API_KEY first (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          python legiscan_check.py --year "${{ inputs.year || '2' }}"

      - name: Commit the report
        run: |
          git config user.name "dv-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dv_index/results/legiscan_check.md dv_index/results/legiscan_hits.csv
          if git diff --cached --quiet; then
            echo "Report unchanged."
          else
            git commit -m "LegiScan cross-check $(TZ=America/Los_Angeles date +%F)"
            git pull --rebase -q
            git push
          fi
